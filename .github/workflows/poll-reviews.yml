name: Review Loop

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  review-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Poll for new reviews
        run: |
          STATUS=$(curl -s -o /tmp/poll.json -w "%{http_code}" \
            -X GET "https://www.0-clicks.uk/api/cron/poll-reviews" \
            -H "x-zeroclicks-token: ${{ secrets.N8N_WEBHOOK_TOKEN }}")
          echo "poll-reviews HTTP $STATUS"
          cat /tmp/poll.json
          [ "$STATUS" = "200" ] || exit 1

      - name: Post approved replies to Google
        run: |
          STATUS=$(curl -s -o /tmp/replies.json -w "%{http_code}" \
            -X GET "https://www.0-clicks.uk/api/cron/post-replies" \
            -H "x-zeroclicks-token: ${{ secrets.N8N_WEBHOOK_TOKEN }}")
          echo "post-replies HTTP $STATUS"
          cat /tmp/replies.json
          [ "$STATUS" = "200" ] || exit 1
