name: Review Loop

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: review-loop-production
  cancel-in-progress: false

jobs:
  review-loop:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      LEGACY_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
    steps:
      - name: Import reviews and publish approved replies
        run: |
          if [[ -n "$CRON_SECRET" ]]; then
            auth_header="Authorization: Bearer $CRON_SECRET"
          elif [[ -n "$LEGACY_WEBHOOK_TOKEN" ]]; then
            auth_header="x-zeroclicks-token: $LEGACY_WEBHOOK_TOKEN"
          else
            echo "::error::Set the CRON_SECRET repository secret."
            exit 1
          fi

          failed=0
          for endpoint in poll-reviews post-replies; do
            status=$(curl -sS --connect-timeout 10 --max-time 290 -o /dev/null -w "%{http_code}" \
              -H "$auth_header" "https://www.0-clicks.uk/api/cron/$endpoint") || status=000
            echo "$endpoint HTTP $status"
            [[ "$status" = "200" ]] || failed=1
          done
          exit "$failed"
