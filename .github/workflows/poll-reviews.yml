name: Review Loop

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: review-loop-production
  cancel-in-progress: false

jobs:
  review-loop:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Import Google reviews and prepare drafts
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Set the CRON_SECRET repository secret."
            exit 1
          fi
          auth_header="Authorization: Bearer $CRON_SECRET"

          status=$(curl -sS --connect-timeout 10 --max-time 290 -o /dev/null -w "%{http_code}" \
            -H "$auth_header" "https://www.0-clicks.uk/api/cron/poll-reviews") || status=000
          echo "poll-reviews HTTP $status"
          [[ "$status" = "200" ]]
