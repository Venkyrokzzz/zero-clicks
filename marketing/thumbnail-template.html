<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero Clicks — YouTube Thumbnail Template (1280x720)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b1220; display: flex; justify-content: center; padding: 40px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .canvas {
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #020817 0%, #0b1220 100%);
    border: 4px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  /* Face/object placeholder — replace with real pub photo */
  .focal {
    position: absolute;
    left: 60px; top: 60px;
    width: 340px; height: 340px;
    background: linear-gradient(180deg, #1a2744 0%, #243060 100%);
    border-radius: 50%;
    border: 6px solid #3b82f6;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 100px; line-height: 1;
    box-shadow: 0 10px 30px rgba(59,130,246,0.3);
  }
  /* Text block — max 4-5 words, large, readable on mobile */
  .text-wrap {
    position: absolute;
    right: 60px; top: 120px;
    max-width: 620px;
  }
  .kicker {
    display: inline-block;
    padding: 6px 14px;
    background: #f59e0b;
    color: #000;
    font-weight: 800;
    font-size: 28px;
    border-radius: 8px;
    margin-bottom: 14px;
    letter-spacing: -0.02em;
  }
  .main {
    font-size: 72px;
    font-weight: 900;
    color: #fff;
    line-height: 1.05;
    margin: 0;
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
  }
  .sub {
    margin-top: 18px;
    font-size: 34px;
    color: #3b82f6;
    font-weight: 700;
  }
  /* Small branding in corner */
  .brand {
    position: absolute;
    left: 60px; bottom: 50px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand-dot {
    width: 34px; height: 34px;
    background: #3b82f6; border-radius: 50%;
  }
  .brand-name {
    color: #fff; font-weight: 700; font-size: 26px; letter-spacing: -0.02em;
  }
  /* Mobile readability guide overlay */
  .guide {
    position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.35) 0%, transparent 50%, rgba(0,0,0,0.35) 100%);
    pointer-events: none;
  }
  .rules {
    position: absolute;
    bottom: 20px; right: 20px;
    background: rgba(0,0,0,0.5);
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    color: #94a3b8; font-size: 14px; line-height: 1.5;
    pointer-events: none;
    max-width: 380px;
  }
  .rules b { color: #f59e0b; }
  @media (max-width: 1400px) {
    body { padding: 20px; }
    .canvas { transform: scale(0.75); transform-origin: top center; width: 1280px; height: 720px; margin: 0 auto; }
  }
</style>
</head>
<body>

<div class="canvas">
  <div class="focal">🍺</div>
  <div class="text-wrap">
    <div class="kicker">8 Seconds</div>
    <h1 class="main">Review Replies<br>Done For You</h1>
    <div class="sub">Zero Clicks • UK Pubs</div>
  </div>
  <div class="brand">
    <div class="brand-dot"></div>
    <div class="brand-name">Zero Clicks</div>
  </div>
  <div class="guide"></div>
  <div class="rules">
    <b>Thumbnail rules:</b>
    • One focal point (face/object)
    • Max 4–5 words, readable on mobile
    • High contrast, simple design
    • Stand out next to competitors
    • 1280 × 720, no clickbait
  </div>
</div>

</body>
</html>
